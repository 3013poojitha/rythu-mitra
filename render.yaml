# Render deployment (https://render.com). Render reads this file automatically.
# The frontend is pre-built into frontend/dist and committed, so Render only needs Python.
services:
  - type: web
    name: rythu-mitra
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_MODE
        value: auto
      # Add these in the Render dashboard (Environment tab) to switch on live AI:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
